[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ptd-dashboard"
version = "0.1.0"
description = "Local-first dashboard host for PyToolDashboard tools."
readme = "README.md"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
ptd-dashboard = "ptd_dashboard.app.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
