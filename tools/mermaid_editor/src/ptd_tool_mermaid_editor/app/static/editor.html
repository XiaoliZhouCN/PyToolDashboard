            setToolbarHeight(state.toolbarResize.startHeight + (evt.clientY - state.toolbarResize.startY));
        });
        window.addEventListener("pointerup", (evt) => {
            state.toolbarResize = null;
            if (state.dragging || state.marquee || state.panning) {
                handleInteractivePointerUp(evt);
            }
        });
        window.addEventListener("pointercancel", (evt) => {
            state.toolbarResize = null;
            if (state.dragging || state.marquee || state.panning) {
                handleInteractivePointerUp(evt);
            }
        });

        canvas.addEventListener("pointermove", (evt) => {
            if (state.toolbarResize) {
                setToolbarHeight(state.toolbarResize.startHeight + (evt.clientY - state.toolbarResize.startY));
                return;
            }
            if (state.dragging || state.edgeDraft || state.marquee || state.panning) {
                return;
            }
            state.pointerWorld = getPoint(evt);
        });

        toolbarResizer.addEventListener("pointerup", () => {
            if (!state.toolbarResize) {
                return;
            }
            state.toolbarResize = null;
        });
        toolbarResizer.addEventListener("pointercancel", () => {
            state.toolbarResize = null;
        });

        canvas.addEventListener("click", () => {
            hideContextMenu();
            if (state.suppressCanvasClick) {
                state.suppressCanvasClick = false;
                return;
            }
            if (state.edgeDraft && !state.edgeDraft.sourceId) {
                notifyStatus("请选择边的起点");
                return;
            }
            if (!state.dragging && !state.marquee && !state.edgeDraft) {
                clearSelection();
                render();
            }
        });

        canvas.addEventListener("dblclick", (evt) => {
            if (!isCanvasBackgroundTarget(evt.target)) {
                return;
            }
            openAddNodeDialog(null, getPoint(evt));
        });

        canvas.addEventListener("pointerdown", (evt) => {
            if (!isCanvasBackgroundTarget(evt.target) || state.edgeDraft) {
                return;
            }
            hideContextMenu();
            const point = getPoint(evt);
            canvas.setPointerCapture(evt.pointerId);
            if (evt.ctrlKey) {
                beginMarquee(point);
                return;
            }
            state.panning = {
                startPoint: screenToCanvas(evt.clientX, evt.clientY),
                startOffsetX: state.view.offsetX,
                startOffsetY: state.view.offsetY,
            };
            canvas.classList.add("panning");
        });

        canvas.addEventListener("wheel", (evt) => {
            evt.preventDefault();
            const looksLikeTrackpad = Math.abs(evt.deltaX) > 0 || Math.abs(evt.deltaY) < 40;
            if (evt.ctrlKey) {
                const ratio = Math.min(0.22, Math.max(0.08, Math.abs(evt.deltaY) / 500));
                const delta = evt.deltaY < 0 ? 1 + ratio : 1 - ratio;
                setView(state.view.scale * delta, currentViewCenterWorld());
                return;
            }
            if (looksLikeTrackpad) {
                state.view.offsetX -= evt.deltaX;
                state.view.offsetY -= evt.deltaY;
                updateViewportTransform();
                return;
            }
            const delta = evt.deltaY < 0 ? 1.1 : 0.9;
            setView(state.view.scale * delta, currentViewCenterWorld());
        }, { passive: false });

        canvas.addEventListener("contextmenu", (evt) => {
            evt.preventDefault();
            if (isCanvasBackgroundTarget(evt.target)) {
                openCanvasContextMenu(evt);
            }
        });

        document.addEventListener("keydown", (evt) => {
            const tagName = document.activeElement?.tagName;
            const isTyping = ["INPUT", "TEXTAREA", "SELECT"].includes(tagName);
            if (evt.key === "Escape") {
                cancelEdgeCreation();
                hideContextMenu();
                closeDialog();
            }
            if ((evt.key === "Delete" || evt.key === "Backspace") && !isTyping) {
                evt.preventDefault();
                deleteSelected();
            }
            if (evt.key === "Enter" && state.dialog) {
                evt.preventDefault();
                confirmDialog();
            }
            if (evt.ctrlKey && evt.key.toLowerCase() === "h") {
                evt.preventDefault();
                centerView(0.5);
            }
            if (evt.ctrlKey && evt.key.toLowerCase() === "q") {
                evt.preventDefault();
                alignSelection("x");
            }
            if (evt.ctrlKey && evt.key.toLowerCase() === "w") {
                evt.preventDefault();
                alignSelection("y");
            }
            if (evt.ctrlKey && evt.key.toLowerCase() === "t") {
                evt.preventDefault();
                if (state.primarySelection?.kind === "subgraph") {
                    fitSubgraphToContents(state.primarySelection.id);
                }
            }
            if (evt.ctrlKey && !evt.shiftKey && evt.key.toLowerCase() === "z" && !isTyping) {
                evt.preventDefault();
                undoDiagramChange();
            }
        });

        window.addEventListener("click", (evt) => {
            if (!contextMenu.contains(evt.target)) {
                hideContextMenu();
            }
        });

        window.loadDiagram = function loadDiagram(diagram) {
            state.diagram = ensureDiagram(diagram);
            state.primarySelection = null;
            state.selectedItems = [];
            state.dragging = null;
            state.panning = null;
            state.edgeDraft = null;
            state.marquee = null;
            state.history.undoStack = [];
            state.history.redoStack = [];
            state.layoutDirty = true;
            hideContextMenu();
            closeDialog();
            centerView(0.5);
            syncSelectionToQt();
            render();
            notifyStatus(`已载入 ${state.diagram.diagram_id}`);
        };
    </script>
</body>
</html>
